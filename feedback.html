<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Wrenna Feedback — vote on features, share ideas.">
    <meta name="theme-color" content="#141210">
    <title>Wrenna — Feedback Board</title>
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23e8734a' d='M6 20 Q8 14 12 12 Q13 8 17 9 Q20 10 19 13 Q23 11 26 14 Q28 16 27 19 Q24 18 22 19 Q20 23 16 24 Q12 25 10 23 Q8 22 6 20 Z'/%3E%3C/svg%3E">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/feedback.css">
</head>
<body class="feedback-body">
    
    <div class="ambient" aria-hidden="true">
        <div class="ambient-glow"></div>
        <span class="ambient-particle" style="--d:0s;--t:18s;--x:12%;--s:3px"></span>
        <span class="ambient-particle" style="--d:4s;--t:22s;--x:35%;--s:2px"></span>
        <span class="ambient-particle" style="--d:2s;--t:16s;--x:60%;--s:4px"></span>
        <span class="ambient-particle" style="--d:6s;--t:20s;--x:82%;--s:2px"></span>
    </div>
    
    <main class="feedback-main">
        <div class="board-card">
            
            <header class="board-header">
                <a href="/" class="board-logo" aria-label="Wrenna home">
                    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                        <path d="M6 20 Q8 14 12 12 Q13 8 17 9 Q20 10 19 13 Q23 11 26 14 Q28 16 27 19 Q24 18 22 19 Q20 23 16 24 Q12 25 10 23 Q8 22 6 20 Z" fill="currentColor"/>
                    </svg>
                    <span>Wrenna</span>
                </a>
                
                <div class="board-header-actions">
                    <button class="btn-soft btn-sm" id="btn-sort" title="Toggle sort">
                        <span id="sort-label">Top</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="4" y1="7" x2="20" y2="7"/><polyline points="10 3 4 7 10 11"/>
                            <line x1="4" y1="17" x2="20" y2="17"/><polyline points="14 13 20 17 14 21"/>
                        </svg>
                    </button>
                    <a href="app.html" class="back-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
                        </svg>
                        Editor
                    </a>
                </div>
            </header>
            
            <div class="board-intro">
                <h1 class="board-title">Field notes</h1>
                <p class="board-sub">Vote on what we build next. Leave your observations.</p>
            </div>
            
            <div class="status-filter" id="status-filter" role="tablist" aria-label="Filter by status">
                <button class="filter-pill active" data-filter="all">All</button>
                <button class="filter-pill" data-filter="review">Under Review</button>
                <button class="filter-pill" data-filter="planned">Planned</button>
                <button class="filter-pill" data-filter="progress">In Progress</button>
                <button class="filter-pill" data-filter="shipped">Shipped</button>
            </div>
            
            <div class="submit-row" id="submit-row">
                <input type="text" id="new-idea-title" class="submit-input" 
                       placeholder="Suggest a feature…" maxlength="120" 
                       aria-label="New idea title">
                <button class="btn-accent btn-sm" id="btn-submit-idea" aria-label="Submit idea">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
            </div>
            
            <div class="board-list" id="board-list" aria-live="polite">
                <div class="board-loading" id="board-loading">
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                </div>
            </div>
            
            <div class="board-footer" id="board-footer" hidden>
                <button class="btn-soft btn-sm" id="btn-load-more">Show more</button>
            </div>
        </div>
    </main>
    
    <div class="toasts" id="toast-container" aria-live="polite"></div>
    
    <script type="module" src="js/feedback.js"></script>
</body>
</html>
